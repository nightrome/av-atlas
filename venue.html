<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'">
<title>AV Atlas — Venue</title>
<meta name="description" content="A venue's autonomous vehicle research coverage: papers, top authors, and citation impact.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="AV Atlas">
<meta property="og:title" content="AV Atlas — Venue">
<meta property="og:description" content="A venue's autonomous vehicle research coverage: papers, top authors, and citation impact.">
<meta property="og:url" content="https://nightrome.github.io/av-atlas/venue.html">
<meta property="og:image" content="https://nightrome.github.io/av-atlas/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="AV Atlas — Venue">
<meta name="twitter:description" content="A venue's autonomous vehicle research coverage: papers, top authors, and citation impact.">
<meta name="twitter:image" content="https://nightrome.github.io/av-atlas/og-image.png">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="theme-light.css">
<style>
  body { max-width: 1100px; margin: 0 auto; padding: 24px; }
  .header { margin-bottom: 8px; }
  .header h2 { margin: 0 0 4px; font-size: 1.5em; }
  .header .tags { color: var(--muted); font-size: 0.9em; }
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin: 20px 0; }
  .stat-tile { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .stat-tile .value { font-size: 1.6em; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat-tile .label { color: var(--muted); font-size: 0.82em; margin-top: 2px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px 20px; margin-bottom: 20px; }
  .panel h2 { margin-top: 0; font-size: 1.1em; }
  table { width: 100%; border-collapse: collapse; font-size: 0.92em; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr:hover { background: var(--panel2); }
  td a { color: var(--accent); text-decoration: none; }
  td a:hover { text-decoration: underline; }
  .chart { display: flex; align-items: flex-end; gap: 3px; height: 100px; padding: 4px 0 0; border-bottom: 2px solid var(--border); }
  .chart .bar-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; position: relative; }
  .chart .bar { width: 100%; max-width: 26px; border-radius: 4px 4px 0 0; background: var(--accent); min-height: 2px; }
  .chart .xlabel { font-size: 0.68em; color: var(--muted); margin-top: 4px; white-space: nowrap; }
  .chart .tooltip {
    display: none; position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
    background: var(--text); color: var(--panel); font-size: 0.72em; padding: 3px 7px; border-radius: 5px;
    white-space: nowrap; margin-bottom: 4px; z-index: 5;
  }
  .chart .bar-wrap:hover .tooltip { display: block; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 700px) { .cols { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<nav id="topnav"></nav>
<div id="detail-back-container"></div>

<div class="header">
  <h2 id="name">—</h2>
  <div class="tags" id="tags"></div>
</div>

<div class="stat-grid" id="stat-grid"></div>

<div class="panel">
  <h2>Papers by year</h2>
  <div class="chart" id="year-chart"></div>
</div>

<div class="cols">
  <div class="panel">
    <h2>Top authors here</h2>
    <table><thead><tr><th>Author</th><th class="num">Papers</th><th class="num" title="How many other papers in this corpus cite this paper. Counted only within this corpus, never from an external database.">Citations</th></tr></thead>
    <tbody id="authors-body"></tbody></table>
  </div>
  <div class="panel">
    <h2>Top institutions here</h2>
    <table><thead><tr><th>Institution</th><th class="num">Papers</th></tr></thead>
    <tbody id="institutions-body"></tbody></table>
  </div>
</div>

<div class="panel">
  <div class="panel-title-row">
    <h2>All papers</h2>
    <div id="export-container"><span class="info-tip" tabindex="0" role="img" aria-label="AV-relevant papers from this venue, most-cited first." data-tip="AV-relevant papers from this venue, most-cited first.">i</span></div>
  </div>
  <div id="papers-pagination"></div>
  <table><thead><tr><th>Title</th><th>Year</th><th>Category</th><th class="num" title="How many other papers in this corpus cite this paper. Counted only within this corpus, never from an external database.">Citations</th></tr></thead>
  <tbody id="papers-body"></tbody></table>
</div>

<script src="filters.js"></script>
<script>
const backLink = renderBackLink();
if (backLink) document.getElementById('detail-back-container').appendChild(backLink);

function stat(value, label, opts) {
  const tile = document.createElement('div');
  tile.className = 'stat-tile';
  const valueEl = document.createElement('div');
  valueEl.className = 'value';
  const labelEl = document.createElement('div');
  labelEl.className = 'label';
  labelEl.textContent = label;
  tile.appendChild(valueEl);
  tile.appendChild(labelEl);
  if (typeof value === 'number' && isFinite(value)) animateCount(valueEl, value, opts);
  else valueEl.textContent = value;
  return tile;
}

const params = new URLSearchParams(location.search);
const name = params.get('name') || '';
document.getElementById('name').textContent = name || 'Unknown venue';

fetch('stats.json').then(r => r.json()).then(applyCitationSource).then(render).catch(err => {
  document.getElementById('papers-body').textContent = 'Could not load stats.json: ' + err;
});

function row(cells) {
  const tr = document.createElement('tr');
  cells.forEach((c, i) => {
    const td = document.createElement('td');
    if (i > 0 && typeof c === 'number') td.className = 'num';
    if (c instanceof Node) td.appendChild(c);
    else td.textContent = c;
    tr.appendChild(td);
  });
  return tr;
}

function titleLink(p) {
  const a = document.createElement('a');
  a.href = `paper.html?title=${encodeURIComponent(p.title)}`;
  a.className = 'truncate-cell';
  a.textContent = p.title;
  a.title = p.title;
  return a;
}

function render(stats) {
  const papers = (stats.all_papers || []).filter(p => p.venue === name);

  const totalIndexed = ((stats.corpus_stats || {}).by_venue || {})[name] || papers.length;
  document.getElementById('tags').textContent =
    `${totalIndexed.toLocaleString()} papers indexed in total (this page shows the ${papers.length} judged AV-relevant)`;

  const citedPapers = papers.filter(p => p.citations != null);
  const totalCitations = citedPapers.reduce((s, p) => s + p.citations, 0);
  const avg = citedPapers.length ? Math.round((totalCitations / citedPapers.length) * 10) / 10 : null;

  const grid = document.getElementById('stat-grid');
  grid.appendChild(stat(papers.length, 'AV papers in corpus'));
  grid.appendChild(stat(totalCitations, 'Citations'));
  grid.appendChild(stat(avg == null ? '—' : avg, 'Citations / paper', { decimals: 1 }));
  const years = papers.map(p => p.year).filter(Boolean);
  grid.appendChild(stat(years.length ? `${Math.min(...years)}–${Math.max(...years)}` : '—', 'Year range (AV papers)'));

  const yearAgg = {};
  papers.forEach(p => {
    if (!p.year) return;
    yearAgg[p.year] = (yearAgg[p.year] || 0) + 1;
  });
  // Fill the whole span between the first and last active year, so years
  // with no papers show as an empty slot rather than being dropped from the
  // axis (which silently compresses a gap into a continuous-looking run).
  const activeYears = Object.keys(yearAgg).map(Number).sort((a, b) => a - b);
  const yearKeys = [];
  if (activeYears.length) {
    for (let y = activeYears[0]; y <= activeYears[activeYears.length - 1]; y++) yearKeys.push(y);
  }
  const chart = document.getElementById('year-chart');
  const maxC = Math.max(1, ...yearKeys.map(y => yearAgg[y] || 0));
  yearKeys.forEach(y => {
    const v = yearAgg[y] || 0;
    const wrap = document.createElement('div');
    wrap.className = 'bar-wrap';
    const bar = document.createElement('div');
    bar.className = 'bar';
    bar.style.height = (v === 0 ? 0 : Math.max(3, (v / maxC) * 100)) + '%';
    const tooltip = document.createElement('div');
    tooltip.className = 'tooltip';
    tooltip.textContent = `${y}: ${v} AV paper${v === 1 ? '' : 's'}`;
    wrap.appendChild(tooltip);
    wrap.appendChild(bar);
    const label = document.createElement('div');
    label.className = 'xlabel';
    label.textContent = y;
    wrap.appendChild(label);
    chart.appendChild(wrap);
  });
  if (!yearKeys.length) chart.textContent = 'No dated AV papers for this venue.';

  const authors = aggregateByDimension(papers, p => p.authors, { minPapers: 0 });
  // By citations, not paper count -- same fix as institution.html's
  // identical "Top authors here" table, for the same reason: a single-paper
  // author with a high-impact paper was otherwise buried below dozens of
  // low-citation multi-paper authors.
  authors.sort((a, b) => b.citations - a.citations);
  const authorsTop15 = authors.slice(0, 15);
  const authorsBody = document.getElementById('authors-body');
  function renderAuthorsBody(rows) {
    authorsBody.innerHTML = '';
    rows.forEach(a => {
      const link = document.createElement('a');
      link.href = `author.html?name=${encodeURIComponent(a.name)}`;
      link.textContent = a.name;
      authorsBody.appendChild(row([link, a.papers, a.citations]));
    });
  }
  makeSortableSafe(authorsBody.closest('table'), authorsTop15, [
    { accessor: a => a.name, numeric: false },
    { accessor: a => a.papers, numeric: true },
    { accessor: a => a.citations, numeric: true },
  ], renderAuthorsBody);

  const insts = aggregateByDimension(papers, p => p.institutions, { minPapers: 0 });
  insts.sort((a, b) => b.papers - a.papers);
  const instsTop15 = insts.slice(0, 15);
  const instsBody = document.getElementById('institutions-body');
  function renderInstsBody(rows) {
    instsBody.innerHTML = '';
    rows.forEach(i => {
      const link = document.createElement('a');
      link.href = `institution.html?name=${encodeURIComponent(i.name)}`;
      link.textContent = i.name;
      instsBody.appendChild(row([link, i.papers]));
    });
  }
  makeSortableSafe(instsBody.closest('table'), instsTop15, [
    { accessor: i => i.name, numeric: false },
    { accessor: i => i.papers, numeric: true },
  ], renderInstsBody);

  const sortedPapers = [...papers].sort((a, b) => (b.citations ?? -Infinity) - (a.citations ?? -Infinity));
  const papersBody = document.getElementById('papers-body');
  function renderBody(rows) {
    papersBody.innerHTML = '';
    rows.forEach(p => papersBody.appendChild(row([
      titleLink(p), p.year || '', categoryLabel(p.category) || '', p.citations ?? '',
    ])));
    appendSumRow(papersBody, rows, [null, null, null, p => p.citations]);
  }
  // Paginate rather than dumping every paper into one table (CVPR alone has
  // over a thousand AV-relevant papers).
  function renderPapersPage() {
    const pg = renderPagination(document.getElementById('papers-pagination'), 'venue.html', sortedPapers.length, { onChange: renderPapersPage });
    const shown = sortedPapers.slice(pg.offset, pg.offset + pg.pageSize);
    makeSortableSafe(document.getElementById('papers-body').closest('table'), shown, [
      { accessor: p => p.title, numeric: false },
      { accessor: p => p.year, numeric: true },
      { accessor: p => p.category, numeric: false },
      { accessor: p => p.citations, numeric: true },
    ], renderBody);
  }
  renderPapersPage();

  const exportContainer = document.getElementById('export-container');
  exportContainer.querySelectorAll('.export-row').forEach(el => el.remove());
  exportContainer.insertBefore(renderExportButtons({
    table: papersBody.closest('table'),
    csvName: `${name}-papers.csv`,
    bibtexPapers: () => sortedPapers,
    bibtexName: `${name}-papers.bib`,
  }), exportContainer.firstChild);
}
</script>
<script src="nav.js"></script>
<script src="sortable.js"></script>
</body>
</html>

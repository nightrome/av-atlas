name: monthly-update

# Dry runs and fetch-only tests get a suffix so they are easy to tell apart.
run-name: monthly-update${{ inputs.dry_run && ' (dry run)' || '' }}${{ inputs.fetch_only && ' (fetch only)' || '' }}

# The monthly data update: restore the corpus backup, fetch what's new
# (arXiv, new conference editions, journal updates on Crossref, Semantic
# Scholar abstracts and references), rebuild, publish to production, back
# up, and propose any changed tracked files in a pull request. All of it is
# in scripts/monthly_update.py; README.md ("Monthly update") covers the
# secrets and what to do when it fails. No LLM, no PDFs.
#
# Needs two repo secrets:
#   AV_ATLAS_BOT_TOKEN        fine-grained token on nightrome/av-atlas with
#                             Contents and Pull requests read/write. It has to
#                             be a personal token, not GITHUB_TOKEN: a gh-pages
#                             push made with GITHUB_TOKEN doesn't start a Pages
#                             build, and a PR it opens doesn't run tests.yml.
#   SEMANTIC_SCHOLAR_API_KEY  the Semantic Scholar API key.
#
# Retries: when a source is down (arXiv unavailable, say) the run still
# publishes what it has, ends green and says nothing; it is tried again at
# 03:17 and 15:17 UTC through the 10th until a run finishes everything, which
# it records with a tag called monthly-done-YYYY-MM. Only a real problem (a
# crash, a failed build or publish) or a source still down on the last slot
# (the 10th, 15:17) turns the run red and opens the failure issue.
# Each retry resumes where the last one stopped (the arXiv harvest checkpoint
# is cached between runs; the Semantic Scholar crawlers keep their own side
# files in the corpus backup) and republishes the site, so a source that is
# down for a day still ends up in that month's site.

on:
  schedule:
    # 03:17 UTC on the 4th of each month (off the hour, when runners are busy),
    # then the retry slots: the "check" job ends the run at once when this
    # month's update has already finished green.
    - cron: "17 3 4 * *"
    - cron: "17 3,15 5-10 * *"
    - cron: "17 15 4 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print what would run"
        type: boolean
        default: false
      fetch_only:
        description: "Run only the fetch steps (no build, commit, publish, backup or PR)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: monthly-update
  cancel-in-progress: false

jobs:
  # Scheduled runs only: skip when this month's update already finished.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.done.outputs.skip }}
    steps:
      - id: done
        run: |
          skip=false
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            tag="monthly-done-$(date -u +%Y-%m)"
            # If the lookup fails, run the update rather than skip it.
            found="$(git ls-remote "https://github.com/$GITHUB_REPOSITORY" "refs/tags/$tag" || true)"
            echo "$tag: ${found:-not there yet}"
            if [ -n "$found" ]; then skip=true; fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

  update:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    # GitHub stops a job at 6 hours. monthly_update.py plans for 320 minutes
    # and stops its crawlers early to fit; the rest is slack for setup and
    # the failure report.
    timeout-minutes: 350
    permissions:
      contents: read
      issues: write     # the failure issue, with GITHUB_TOKEN
      actions: write    # re-enabling this workflow, see the first step
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONIOENCODING: utf-8
    steps:
      # GitHub switches off scheduled workflows in a public repo after 60 days
      # without activity. Enabling it again on every run resets that clock,
      # and this runs monthly, so it never gets there.
      - name: Keep the schedule enabled
        continue-on-error: true
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/monthly-update.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: carrying files forward from the bot branch needs
          # its merge base with main.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      # The arXiv harvest writes each page to this file as it goes, and a
      # retry run picks up from it. Saved even when the run fails (that is
      # the point); keys are per run, restore takes the newest one.
      - name: Restore the arXiv harvest checkpoint
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/arxiv_harvest_checkpoint.jsonl
          key: arxiv-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: arxiv-checkpoint-

      - name: Install the crawlers' dependencies
        run: python -m pip install -r scripts/requirements.txt

      # Every git push (the bot branch here, gh-pages from the clone deploy.py
      # makes in .deploy-cache/) authenticates with the bot token. The helper
      # reads it from the environment when git asks, so it is never written
      # to disk or into a remote URL.
      - name: Set up git
        run: |
          git config --global credential.helper '!f() { test "$1" = get && echo username=x-access-token && echo "password=$AV_ATLAS_BOT_TOKEN"; }; f'
          git config --global user.name "AV Atlas monthly update"
          git config --global user.email "holger@it-caesar.com"

      - name: Run the monthly update
        run: |
          set -o pipefail
          args=(--work-dir "$RUNNER_TEMP/monthly-update")
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ "$FETCH_ONLY" = "true" ]; then args+=(--fetch-only); fi
          # A source that is down only fails the run on the last slot of the
          # month (the 10th, 15:17 UTC) or when someone started it by hand.
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && ! { [ "$(date -u +%-d)" -ge 10 ] && [ "$(date -u +%-H)" -ge 14 ]; }; then
            args+=(--retry-later)
          fi
          python scripts/monthly_update.py "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/monthly-update.log"
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          FETCH_ONLY: ${{ inputs.fetch_only }}
          AV_ATLAS_BOT_TOKEN: ${{ secrets.AV_ATLAS_BOT_TOKEN }}
          # restore_corpus.py and backup_corpus.py read this name.
          GITHUB_TOKEN: ${{ secrets.AV_ATLAS_BOT_TOKEN }}
          GH_TOKEN: ${{ secrets.AV_ATLAS_BOT_TOKEN }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}

      - name: Save the arXiv harvest checkpoint
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/arxiv_harvest_checkpoint.jsonl
          key: arxiv-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}

      # Not for a fetch-only test run: that's someone watching the log anyway.
      - name: Open or update the failure issue
        if: failure() && inputs.fetch_only != true
        run: python scripts/monthly_update.py --report-failure "$RUNNER_TEMP/monthly-update.log" --work-dir "$RUNNER_TEMP/monthly-update"
        env:
          GH_TOKEN: ${{ github.token }}

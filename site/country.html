<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://gc.zgo.at; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self' https://av-atlas.goatcounter.com/count; object-src 'none'; base-uri 'self'; frame-ancestors 'none'">
<title>AV Atlas: Country</title>
<meta name="description" content="A country's contribution to autonomous vehicle research: papers, citations, top authors and institutions.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="AV Atlas">
<meta property="og:title" content="AV Atlas: Country">
<meta property="og:description" content="A country's contribution to autonomous vehicle research: papers, citations, top authors and institutions.">
<meta property="og:url" content="https://nightrome.github.io/av-atlas/country.html">
<link rel="canonical" href="https://nightrome.github.io/av-atlas/country.html">
<meta property="og:image" content="https://nightrome.github.io/av-atlas/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="AV Atlas: Country">
<meta name="twitter:description" content="A country's contribution to autonomous vehicle research: papers, citations, top authors and institutions.">
<meta name="twitter:image" content="https://nightrome.github.io/av-atlas/og-image.png">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="preload" href="stats.json" as="fetch" crossorigin>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="theme-light.css">
<style>
  body { max-width: 1100px; margin: 0 auto; padding: 24px; }
  .header { display: flex; gap: 20px; align-items: center; margin-bottom: 8px; }
  .avatar {
    width: 72px; height: 72px; border-radius: 14px; display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 1.3em; color: #fff; flex-shrink: 0; overflow: hidden; background: var(--panel2);
  }
  .header h2 { margin: 0 0 4px; font-size: 1.5em; }
  .header .tags { color: var(--muted); font-size: 0.9em; }
  .header .tags a { color: var(--accent); text-decoration: none; }
  .header .tags a:hover { text-decoration: underline; }
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin: 20px 0; }
  .stat-tile { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; position: relative; }
  .stat-tile .info-tip { position: absolute; top: 10px; right: 10px; }
  .stat-tile .value { font-size: 1.6em; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat-tile .label { color: var(--muted); font-size: 0.82em; margin-top: 2px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px 20px; margin-bottom: 20px; }
  .panel h2 { margin-top: 0; font-size: 1.1em; }
  table { width: 100%; border-collapse: collapse; font-size: 0.92em; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr:hover { background: var(--panel2); }
  td a { color: var(--accent); text-decoration: none; }
  td a:hover { text-decoration: underline; }
  .chart { display: flex; align-items: flex-end; gap: 3px; height: 100px; padding: 4px 0 0; border-bottom: 2px solid var(--border); }
  .chart .bar-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; position: relative; }
  .chart .bar { width: 100%; max-width: 26px; border-radius: 4px 4px 0 0; background: var(--accent); min-height: 2px; }
  .chart .xlabel { font-size: 0.68em; color: var(--muted); margin-top: 4px; white-space: nowrap; }
  .chart .tooltip {
    display: none; position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
    background: var(--text); color: var(--panel); font-size: 0.72em; padding: 3px 7px; border-radius: 5px;
    white-space: nowrap; margin-bottom: 4px; z-index: 5;
  }
  .chart .bar-wrap:hover .tooltip { display: block; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 700px) { .cols { grid-template-columns: 1fr; } }
  .cell-clip { display: inline-block; max-width: 230px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: bottom; }
</style>
</head>
<body>
<nav id="topnav"></nav>
<div id="detail-back-container"></div>

<div class="header">
  <div class="avatar" id="avatar"></div>
  <div>
    <h2 id="name">…</h2>
    <div class="tags" id="tags"></div>
  </div>
</div>

<div id="rank-badges" class="rank-badges"></div>

<div class="stat-grid" id="stat-grid"></div>

<div class="panel">
  <div class="panel-title-row"><h2>Papers by year</h2><span class="info-tip" tabindex="0" role="img" aria-label="AV-relevant papers with at least one author in this country, by publication year." data-tip="AV-relevant papers with at least one author in this country, by publication year.">i</span></div>
  <div class="chart" id="year-chart"></div>
</div>

<div class="cols">
  <div class="panel">
    <div class="panel-title-row"><h2>Top authors</h2><span class="info-tip" tabindex="0" role="img" aria-label="Authors credited with this country, ranked by their citations across the corpus. Covers authors with an affiliation on record, so it is a lower bound." data-tip="Authors credited with this country, ranked by their citations across the corpus. Covers authors with an affiliation on record, so it is a lower bound.">i</span></div>
    <table><thead><tr><th>Author</th><th>Institution</th><th class="num">Papers</th><th class="num" data-term="citations">Citations</th></tr></thead>
    <tbody id="authors-body"></tbody></table>
  </div>
  <div class="panel">
    <div class="panel-title-row"><h2>Top institutions</h2><span class="info-tip" tabindex="0" role="img" aria-label="Institutions in this country, ranked by the citations of the papers crediting them." data-tip="Institutions in this country, ranked by the citations of the papers crediting them.">i</span></div>
    <table><thead><tr><th>Institution</th><th class="num">Papers</th><th class="num" data-term="citations">Citations</th></tr></thead>
    <tbody id="institutions-body"></tbody></table>
  </div>
</div>

<div class="cols">
  <div class="panel">
    <div class="panel-title-row"><h2>Top categories</h2><span class="info-tip" tabindex="0" role="img" aria-label="The research categories this country's AV papers fall into, most common first." data-tip="The research categories this country's AV papers fall into, most common first.">i</span></div>
    <table><thead><tr><th>Category</th><th class="num">Papers</th></tr></thead>
    <tbody id="categories-body"></tbody></table>
  </div>
  <div class="panel">
    <div class="panel-title-row"><h2>Top venues</h2><span class="info-tip" tabindex="0" role="img" aria-label="Where this country's AV papers are published, most common first." data-tip="Where this country's AV papers are published, most common first.">i</span></div>
    <table><thead><tr><th>Venue</th><th class="num">Papers</th></tr></thead>
    <tbody id="venues-body"></tbody></table>
  </div>
</div>

<div class="panel">
  <div class="panel-title-row">
    <h2>Papers</h2>
    <div id="export-container"><span class="info-tip" tabindex="0" role="img" aria-label="Papers with at least one author in this country, most-cited first." data-tip="Papers with at least one author in this country, most-cited first.">i</span></div>
  </div>
  <div id="papers-pagination"></div>
  <table><thead><tr><th>Title</th><th>Year</th><th>Venue</th><th>Category</th><th class="num" data-term="citations">Citations</th></tr></thead>
  <tbody id="papers-body"></tbody></table>
</div>

<script src="filters.js"></script>
<script>
const backLink = renderBackLink();
if (backLink) document.getElementById('detail-back-container').appendChild(backLink);

function hashString(s) { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h; }
function colorFor(name) { return `hsl(${hashString(name) % 360}, 60%, 45%)`; }

function stat(value, label, opts) {
  const tile = document.createElement('div');
  tile.className = 'stat-tile';
  const valueEl = document.createElement('div');
  valueEl.className = 'value';
  const labelEl = document.createElement('div');
  labelEl.className = 'label';
  labelEl.textContent = label;
  tile.appendChild(valueEl);
  tile.appendChild(labelEl);
  if (typeof value === 'number' && isFinite(value)) animateCount(valueEl, value, opts);
  else valueEl.textContent = value;
  return tile;
}

const params = new URLSearchParams(location.search);
const name = params.get('name') || '';
document.getElementById('name').textContent = name || 'Unknown country';
setDetailPageMeta(name, name
  ? `${name}'s autonomous vehicle research in AV Atlas: papers, citations within AV research, top authors and institutions.`
  : null);

// A country's authors are whoever author_detail (sharded by name, see
// aggregate.py's AUTHOR_DETAIL_DIR comment) credits with it, so the shards for
// every author on this country's papers are fetched before render() runs.
fetch('stats.json').then(r => r.json()).then(applyCitationSource).then(stats => {
  const names = new Set();
  (stats.all_papers || []).forEach(p => {
    if ((p.countries || []).includes(name)) (p.authors || []).forEach(a => names.add(a));
  });
  return window.fetchAuthorDetail([...names]).then(detailMap => {
    stats.author_detail = Object.fromEntries(detailMap);
    return stats;
  });
}).then(render).catch(err => {
  document.getElementById('papers-body').textContent = 'Could not load stats.json: ' + err;
});

function row(cells) {
  const tr = document.createElement('tr');
  cells.forEach((c, i) => {
    const td = document.createElement('td');
    if (i > 0 && typeof c === 'number') td.className = 'num';
    if (c instanceof Node) td.appendChild(c);
    else td.textContent = c;
    tr.appendChild(td);
  });
  return tr;
}

function link(href, text) {
  const a = document.createElement('a');
  a.href = href;
  a.textContent = text;
  return a;
}

function clipped(href, text) {
  const a = link(href, text);
  a.className = 'cell-clip';
  a.title = text;
  return a;
}

// Fills an empty-state row so a panel with nothing to show doesn't look broken.
function emptyRow(body, cols, text) {
  const tr = document.createElement('tr');
  const td = document.createElement('td');
  td.colSpan = cols;
  td.style.color = 'var(--muted)';
  td.textContent = text;
  tr.appendChild(td);
  body.appendChild(tr);
}

function render(stats) {
  const papers = (stats.all_papers || []).filter(p => (p.countries || []).includes(name));
  const codes = stats.country_codes || {};
  const code = codes[name] || name.slice(0, 3).toUpperCase();

  const avatar = document.getElementById('avatar');
  avatar.style.background = colorFor(name);
  avatar.textContent = code;

  const tags = document.getElementById('tags');
  if (!papers.length) {
    tags.textContent = 'No AV papers on record for this country.';
  } else {
    tags.append(`${code} · `);
    tags.appendChild(link(`index.html?country=${encodeURIComponent(name)}`, 'See these in the Papers page'));
  }

  try {
    renderRankBadges(document.getElementById('rank-badges'), computeEntityRanks(stats).country(name));
  } catch (e) { /* ranking is a top-of-page extra, never block the page for it */ }

  const authorDetail = stats.author_detail || {};
  const instCountries = stats.institution_countries || {};
  const authorPaperStats = computeAuthorPaperStats(stats.all_papers);

  // Authors credited with this country by their OWN record (not every author
  // of a paper that merely touches it -- see countries.html for why).
  const countryAuthors = new Set();
  papers.forEach(p => (p.authors || []).forEach(a => {
    if (((authorDetail[a] || {}).countries || []).includes(name)) countryAuthors.add(a);
  }));

  // Institutions credited on this country's papers whose own resolved country
  // is this one. Papers that list institutions from elsewhere (a foreign
  // co-author's) would otherwise all show up here. If the map knows none for
  // this country, fall back to everything the papers list.
  const mapped = papers.some(p => (p.institutions || []).some(i => instCountries[i] === name));
  const inCountry = i => !mapped || instCountries[i] === name;
  const institutions = aggregateByDimension(papers, p => (p.institutions || []).filter(inCountry), { minPapers: 0 });

  const citedPapers = papers.filter(p => p.citations != null);
  const totalCitations = citedPapers.reduce((s, p) => s + p.citations, 0);
  const avg = citedPapers.length ? Math.round((totalCitations / citedPapers.length) * 10) / 10 : null;

  const grid = document.getElementById('stat-grid');
  grid.appendChild(stat(papers.length, 'AV papers in corpus'));
  grid.appendChild(stat(totalCitations, 'Citations'));
  grid.appendChild(stat(avg == null ? 'n/a' : avg, 'Citations / paper', { decimals: 1 }));
  grid.appendChild(stat(countryAuthors.size, 'Authors on record'));
  grid.appendChild(stat(institutions.length, 'Institutions'));
  if (grid.firstElementChild) {
    grid.firstElementChild.appendChild(infoTip(
      "This country's totals in the corpus: AV papers with at least one author here, their in-corpus citations, citations per paper, authors credited with this country, and institutions."));
  }

  // Papers by year, with empty years kept on the axis.
  const yearAgg = {};
  papers.forEach(p => { if (p.year) yearAgg[p.year] = (yearAgg[p.year] || 0) + 1; });
  const activeYears = Object.keys(yearAgg).map(Number).sort((a, b) => a - b);
  const years = [];
  if (activeYears.length) for (let y = activeYears[0]; y <= activeYears[activeYears.length - 1]; y++) years.push(y);
  const chart = document.getElementById('year-chart');
  const maxC = Math.max(1, ...years.map(y => yearAgg[y] || 0));
  years.forEach(y => {
    const v = yearAgg[y] || 0;
    const wrap = document.createElement('div');
    wrap.className = 'bar-wrap';
    const bar = document.createElement('div');
    bar.className = 'bar';
    bar.style.height = (v === 0 ? 0 : Math.max(3, (v / maxC) * 100)) + '%';
    const tooltip = document.createElement('div');
    tooltip.className = 'tooltip';
    tooltip.textContent = `${y}: ${v} paper${v === 1 ? '' : 's'}`;
    wrap.appendChild(tooltip);
    wrap.appendChild(bar);
    const label = document.createElement('div');
    label.className = 'xlabel';
    label.textContent = y;
    wrap.appendChild(label);
    chart.appendChild(wrap);
  });
  if (!years.length) chart.textContent = 'No dated papers for this country.';

  // Top authors, by citations across the corpus.
  const authorRows = [...countryAuthors].map(a => {
    const insts = (authorDetail[a] || {}).institutions || [];
    const here = insts.filter(i => instCountries[i.name] === name);
    const inst = institutionForYears(here.length ? here : insts, []);
    const s = authorPaperStats[a] || {};
    return { name: a, institution: inst ? inst.name : null, papers: s.papers || 0, citations: s.citations || 0 };
  }).sort((a, b) => b.citations - a.citations).slice(0, 15);
  const authorsBody = document.getElementById('authors-body');
  function renderAuthorsBody(rows) {
    authorsBody.innerHTML = '';
    rows.forEach(r => authorsBody.appendChild(row([
      link(`author.html?name=${encodeURIComponent(r.name)}`, r.name),
      r.institution ? clipped(`institution.html?name=${encodeURIComponent(r.institution)}`, r.institution) : 'n/a',
      r.papers, r.citations,
    ])));
    if (!rows.length) emptyRow(authorsBody, 4, 'No authors with an affiliation on record yet.');
  }
  makeSortableSafe(authorsBody.closest('table'), authorRows, [
    { accessor: r => r.name, numeric: false },
    { accessor: r => r.institution || '', numeric: false },
    { accessor: r => r.papers, numeric: true },
    { accessor: r => r.citations, numeric: true },
  ], renderAuthorsBody);

  // Top institutions.
  institutions.sort((a, b) => b.citations - a.citations);
  const instTop = institutions.slice(0, 15);
  const instBody = document.getElementById('institutions-body');
  function renderInstBody(rows) {
    instBody.innerHTML = '';
    rows.forEach(r => instBody.appendChild(row([
      clipped(`institution.html?name=${encodeURIComponent(r.name)}`, r.name), r.papers, r.citations,
    ])));
    if (!rows.length) emptyRow(instBody, 3, 'No institutions on record yet.');
  }
  makeSortableSafe(instBody.closest('table'), instTop, [
    { accessor: r => r.name, numeric: false },
    { accessor: r => r.papers, numeric: true },
    { accessor: r => r.citations, numeric: true },
  ], renderInstBody);

  // Top categories.
  const cats = aggregateByDimension(papers, p => [p.category || 'uncategorized'], { minPapers: 0 })
    .sort((a, b) => b.papers - a.papers).slice(0, 15);
  const catsBody = document.getElementById('categories-body');
  function renderCatsBody(rows) {
    catsBody.innerHTML = '';
    rows.forEach(c => catsBody.appendChild(row([
      link(`index.html?category=${encodeURIComponent(c.name)}&country=${encodeURIComponent(name)}`, categoryLabel(c.name)),
      c.papers,
    ])));
  }
  makeSortableSafe(catsBody.closest('table'), cats, [
    { accessor: c => categoryLabel(c.name), numeric: false },
    { accessor: c => c.papers, numeric: true },
  ], renderCatsBody);

  // Top venues.
  const venues = aggregateByDimension(papers, p => [p.venue], { minPapers: 0 })
    .sort((a, b) => b.papers - a.papers).slice(0, 15);
  const venuesBody = document.getElementById('venues-body');
  function renderVenuesBody(rows) {
    venuesBody.innerHTML = '';
    rows.forEach(v => venuesBody.appendChild(row([
      clipped(`venue.html?name=${encodeURIComponent(v.name)}`, v.name), v.papers,
    ])));
  }
  makeSortableSafe(venuesBody.closest('table'), venues, [
    { accessor: v => v.name, numeric: false },
    { accessor: v => v.papers, numeric: true },
  ], renderVenuesBody);

  // Papers, most-cited first, paginated.
  const sortedPapers = [...papers].sort((a, b) => (b.citations ?? -Infinity) - (a.citations ?? -Infinity));
  const papersBody = document.getElementById('papers-body');
  function renderBody(rows) {
    papersBody.innerHTML = '';
    rows.forEach(p => {
      const t = clipped(`paper.html?title=${encodeURIComponent(p.title)}`, p.title);
      t.style.maxWidth = '420px';
      papersBody.appendChild(row([t, p.year || '', p.venue || '', categoryLabel(p.category) || '', p.citations ?? '']));
    });
    appendSumRow(papersBody, rows, [null, null, null, null, p => p.citations]);
  }
  function renderPapersPage() {
    const pg = renderPagination(document.getElementById('papers-pagination'), 'country.html', sortedPapers.length, { onChange: renderPapersPage });
    const shown = sortedPapers.slice(pg.offset, pg.offset + pg.pageSize);
    makeSortableSafe(papersBody.closest('table'), shown, [
      { accessor: p => p.title, numeric: false },
      { accessor: p => p.year, numeric: true },
      { accessor: p => p.venue, numeric: false },
      { accessor: p => p.category, numeric: false },
      { accessor: p => p.citations, numeric: true },
    ], renderBody);
  }
  renderPapersPage();

  const exportContainer = document.getElementById('export-container');
  exportContainer.querySelectorAll('.export-row').forEach(el => el.remove());
  exportContainer.insertBefore(renderExportButtons({
    table: papersBody.closest('table'),
    csvName: `${name}-papers.csv`,
    bibtexPapers: () => sortedPapers,
    bibtexName: `${name}-papers.bib`,
  }), exportContainer.firstChild);
}
</script>
<script src="nav.js"></script>
<script src="sortable.js"></script>
</body>
</html>

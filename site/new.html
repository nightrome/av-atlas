<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'">
<title>AV Atlas: New papers</title>
<meta name="description" content="Autonomous vehicle papers added to AV Atlas in the last three months, by the month they were added.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="AV Atlas">
<meta property="og:title" content="AV Atlas: New papers">
<meta property="og:description" content="Autonomous vehicle papers added to AV Atlas in the last three months, by the month they were added.">
<meta property="og:url" content="https://nightrome.github.io/av-atlas/new.html">
<link rel="canonical" href="https://nightrome.github.io/av-atlas/new.html">
<meta property="og:image" content="https://nightrome.github.io/av-atlas/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="AV Atlas: New papers">
<meta name="twitter:description" content="Autonomous vehicle papers added to AV Atlas in the last three months, by the month they were added.">
<meta name="twitter:image" content="https://nightrome.github.io/av-atlas/og-image.png">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="alternate" type="application/atom+xml" title="AV Atlas: new papers" href="feed.xml">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="theme-light.css">
<style>
  body { max-width: 1100px; margin: 0 auto; padding: 24px; }
  .page-title { margin: 0 0 6px; font-size: 1.5em; }
  .intro { color: var(--muted); font-size: 0.9em; margin: 0 0 18px; line-height: 1.5; }
  .intro a { color: var(--accent); }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px 20px; margin-bottom: 20px; }
  .panel h2 { margin-top: 0; font-size: 1.1em; }
  .panel h2 .count { color: var(--muted); font-weight: 400; font-size: 0.85em; margin-left: 6px; }
  table { width: 100%; border-collapse: collapse; font-size: 0.92em; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr:hover { background: var(--panel2); }
  td a { color: var(--text); text-decoration: none; }
  td a:hover { text-decoration: underline; }
  td.authors { color: var(--muted); font-size: 0.92em; }
  td.authors a { color: var(--muted); }
  td a.arxiv-link { color: var(--accent); }
  .empty { color: var(--muted); }
</style>
</head>
<body>
<nav id="topnav"></nav>

<h2 class="page-title">New papers</h2>
<p class="intro" id="intro">Autonomous vehicle papers added to AV Atlas in the last three months, grouped by the month they were added. A paper can be older than the month it was added in: a new venue edition or a paper found late shows up here when it enters the corpus. Also available as an <a href="feed.xml">Atom feed</a>.</p>

<div id="months"></div>

<script>
const MONTH_NAMES = ['January', 'February', 'March', 'April', 'May', 'June', 'July',
  'August', 'September', 'October', 'November', 'December'];

function monthLabel(ym) {
  const [y, m] = ym.split('-');
  return `${MONTH_NAMES[Number(m) - 1] || m} ${y}`;
}

function link(href, text, className) {
  const a = document.createElement('a');
  a.href = href;
  a.textContent = text;
  if (className) a.className = className;
  return a;
}

function cell(content, className) {
  const td = document.createElement('td');
  if (className) td.className = className;
  if (content instanceof Object && content.tagName) td.appendChild(content);
  else if (content !== null && content !== undefined) td.textContent = content;
  return td;
}

function authorsCell(p) {
  const td = cell(null, 'authors');
  const shown = (p.authors || []).slice(0, 3);
  shown.forEach((name, i) => {
    if (i) td.appendChild(document.createTextNode(', '));
    td.appendChild(link(`author.html?name=${encodeURIComponent(name)}`, name));
  });
  if ((p.n_authors || shown.length) > shown.length) td.appendChild(document.createTextNode(' et al.'));
  return td;
}

function paperRow(p) {
  const tr = document.createElement('tr');
  tr.appendChild(cell(link(`paper.html?title=${encodeURIComponent(p.title)}`, p.title)));
  tr.appendChild(authorsCell(p));
  tr.appendChild(cell(p.venue || ''));
  tr.appendChild(cell(p.year || '', 'num'));
  // new_papers.py only lets http(s) links through; checked again here since
  // this goes straight into an href.
  const arxiv = /^https?:\/\//i.test(p.arxiv_url || '')
    ? link(p.arxiv_url, 'arXiv', 'arxiv-link') : null;
  if (arxiv) { arxiv.target = '_blank'; arxiv.rel = 'noopener'; }
  tr.appendChild(cell(arxiv));
  return tr;
}

function monthPanel(ym, papers) {
  const panel = document.createElement('div');
  panel.className = 'panel';
  const h = document.createElement('h2');
  h.textContent = monthLabel(ym);
  const count = document.createElement('span');
  count.className = 'count';
  count.textContent = `${papers.length} paper${papers.length === 1 ? '' : 's'}`;
  h.appendChild(count);
  panel.appendChild(h);

  const table = document.createElement('table');
  const thead = document.createElement('thead');
  const headRow = document.createElement('tr');
  [['Title'], ['Authors'], ['Venue'], ['Year', 'num'], ['Links']].forEach(([label, cls]) => {
    const th = document.createElement('th');
    th.textContent = label;
    if (cls) th.className = cls;
    headRow.appendChild(th);
  });
  thead.appendChild(headRow);
  table.appendChild(thead);
  const tbody = document.createElement('tbody');
  papers.forEach(p => tbody.appendChild(paperRow(p)));
  table.appendChild(tbody);
  panel.appendChild(table);
  return panel;
}

function renderNewPapers(data) {
  const container = document.getElementById('months');
  container.textContent = '';
  const papers = (data && data.papers) || [];
  if (!papers.length) {
    const p = document.createElement('p');
    p.className = 'empty';
    p.textContent = 'No papers have been added in the last three months.';
    container.appendChild(p);
    return;
  }
  // Already newest first (new_papers.py), so months come out in order.
  const byMonth = new Map();
  papers.forEach(p => {
    const ym = String(p.first_seen || '').slice(0, 7);
    if (!byMonth.has(ym)) byMonth.set(ym, []);
    byMonth.get(ym).push(p);
  });
  byMonth.forEach((list, ym) => container.appendChild(monthPanel(ym, list)));
}

fetch('new_papers.json')
  .then(r => r.json())
  .then(renderNewPapers)
  .catch(err => {
    document.getElementById('months').textContent = `Could not load new_papers.json: ${err}`;
  });
</script>
<script src="nav.js"></script>
</body>
</html>

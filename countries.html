<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'">
<title>AV Atlas — Countries</title>
<meta name="description" content="Which countries are most active in autonomous vehicle research, by papers and citations.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="AV Atlas">
<meta property="og:title" content="AV Atlas — Countries">
<meta property="og:description" content="Which countries are most active in autonomous vehicle research, by papers and citations.">
<meta property="og:url" content="https://nightrome.github.io/av-atlas/countries.html">
<meta property="og:image" content="https://nightrome.github.io/av-atlas/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="AV Atlas — Countries">
<meta name="twitter:description" content="Which countries are most active in autonomous vehicle research, by papers and citations.">
<meta name="twitter:image" content="https://nightrome.github.io/av-atlas/og-image.png">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="theme-light.css">
<style>
  body { max-width: 1100px; margin: 0 auto; padding: 24px; }
  .page-title { margin: 0 0 16px; font-size: 1.5em; }
  h2 { font-size: 1.1em; margin: 28px 0 12px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px 20px; margin-bottom: 20px; }

  .map-grid { display: grid; grid-template-columns: repeat(17, 1fr); grid-auto-rows: 34px; gap: 3px; max-width: 900px; margin: 0 auto; }
  .tile {
    border-radius: 4px; display: flex; align-items: center; justify-content: center;
    font-size: 0.62em; font-weight: 600; color: #fff; text-align: center; line-height: 1.1;
    text-decoration: none; padding: 2px; overflow: hidden; border: 1px solid rgba(255,255,255,0.15);
  }
  .tile:hover { outline: 2px solid var(--accent); }
  .legend { display: flex; align-items: center; gap: 6px; margin-top: 14px; font-size: 0.8em; color: var(--muted); }
  .legend .swatch { width: 16px; height: 12px; border-radius: 2px; }

  table { width: 100%; border-collapse: collapse; font-size: 0.92em; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }

  .timeline-controls-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: -4px 0 4px; font-size: 0.85em; color: var(--muted); }
  .line-chart-wrap { position: relative; }
  .line-chart-wrap svg { width: 100%; height: auto; display: block; }
  .series-line { fill: none; stroke-width: 2.5; opacity: 0.9; }
  .series-dot { cursor: pointer; }
  .axis-line { stroke: var(--border); }
  .axis-label { fill: var(--muted); font-size: 10.5px; }
  .crosshair { stroke: var(--muted); stroke-dasharray: 3 3; pointer-events: none; }
  .legend-row { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 12px 0 4px; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.82em; color: var(--text); cursor: pointer; user-select: none; padding: 2px 4px; border-radius: 5px; }
  .legend-item:hover { background: var(--panel2); }
  .legend-item.off { color: var(--muted); text-decoration: line-through; opacity: 0.6; }
  .legend-item .swatch { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }
  .tooltip-box { position: absolute; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 0.8em; pointer-events: none; box-shadow: 0 4px 14px rgba(0,0,0,0.25); min-width: 140px; display: none; z-index: 10; }
  .tooltip-box .tt-year { font-weight: 700; margin-bottom: 4px; }
  .tooltip-box .tt-row { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .tooltip-box .tt-swatch { width: 9px; height: 9px; border-radius: 2px; flex-shrink: 0; }
  .tooltip-box .tt-val { margin-left: auto; font-variant-numeric: tabular-nums; padding-left: 10px; }
</style>
</head>
<body>
<nav id="topnav"></nav>
<div id="filter-bar-container"></div>

<div class="panel">
  <h2 style="margin-top:0;">World map</h2>
  <div class="map-grid" id="map"></div>
  <div class="legend" id="legend"></div>
</div>

<div class="panel" id="timeline-panel">
  <div class="panel-title-row">
    <h2 style="margin-top:0;">Countries over time</h2>
  </div>
  <div class="timeline-controls-row">
    <label style="display:flex;align-items:center;gap:4px;">
      <input type="checkbox" id="timeline-normalize" checked>
      Normalize by total papers that year
    </label>
    <span style="color:var(--muted);">Click a legend entry to toggle it on/off.</span>
  </div>
  <div class="line-chart-wrap" id="timeline-chart-wrap">
    <svg id="timeline-chart"></svg>
    <div class="tooltip-box" id="timeline-tooltip"></div>
  </div>
  <div class="legend-row" id="timeline-legend"></div>
</div>

<div class="panel">
  <div class="panel-title-row">
    <h2 style="margin-top:0;">All countries</h2>
    <div id="export-container"><span class="info-tip" tabindex="0" role="img" aria-label="Countries by AV-relevant paper count, distinct authors, and total in-corpus citations, for the current filters." data-tip="Countries by AV-relevant paper count, distinct authors, and total in-corpus citations, for the current filters.">i</span></div>
  </div>
  <p id="total-countries-stat" style="color: var(--muted); font-size: 0.85em; margin: -6px 0 12px;"></p>
  <div id="countries-pagination"></div>
  <table><thead><tr><th>#</th><th>Country</th><th class="num">Papers</th><th class="num">Authors</th><th class="num" title="How many other papers in this corpus cite a paper from this country. Counted only within this corpus, never from an external database.">Citations</th><th class="num" title="Average in-corpus citations per paper, counted only over papers with a known citation count.">Citations / paper</th></tr></thead>
  <tbody id="countries-body"></tbody></table>
</div>

<script src="filters.js"></script>
<script>
const COUNTRY_GRID = {
  "United States": [2, 2], "Canada": [1, 2], "Mexico": [3, 1],
  "Brazil": [5, 4], "Argentina": [6, 3], "Chile": [6, 2],
  "United Kingdom": [2, 7], "Ireland": [2, 6],
  "France": [2, 8], "Germany": [2, 9], "Netherlands": [1, 8], "Belgium": [2, 8],
  "Switzerland": [3, 8], "Italy": [3, 9], "Austria": [2, 10],
  "Denmark": [0, 9], "Sweden": [0, 10], "Norway": [0, 8], "Finland": [0, 11],
  "Poland": [1, 10], "Czechia": [2, 10], "Hungary": [3, 10], "Romania": [3, 11],
  "Greece": [4, 10], "Turkey": [4, 11], "Russia": [1, 13],
  "Ukraine": [2, 11], "Israel": [4, 12], "Saudi Arabia": [4, 13],
  "United Arab Emirates": [5, 13], "Qatar": [4, 13], "Egypt": [4, 9],
  "South Africa": [7, 9], "India": [4, 14], "Pakistan": [3, 13],
  "Bangladesh": [4, 15], "Thailand": [5, 15], "Malaysia": [6, 15],
  "Indonesia": [6, 16], "Vietnam": [5, 16], "Singapore": [6, 15],
  "China": [2, 15], "Taiwan": [3, 16], "Japan": [2, 16],
  "South Korea": [2, 16], "Australia": [7, 16],
  "New Zealand": [8, 17], "Iceland": [0, 6], "Portugal": [3, 6], "Spain": [3, 7],
  "Iran": [3, 12], "Luxembourg": [2, 8],
};

function hashString(s) { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h; }
function initials(name) {
  const parts = name.trim().split(/\s+/).filter(Boolean);
  return parts.length <= 1 ? name.slice(0, 3) : parts.map(p => p[0]).join('').slice(0, 3);
}

const SEQ_RAMP = ['#cde2fb', '#9ec5f4', '#6da7ec', '#3987e5', '#256abf', '#184f95', '#0d366b'];

// null means no paper from that country has a citation count at all (as
// opposed to a real average of 0) -- show "—", not a misleading number.
function fmtAvg(v) { return v == null ? '—' : v; }

let currentStats = null, currentFilters = null;
let currentQuery = new URLSearchParams(location.search).get('q') || '';
let currentTimelineDraw = null;
const relevance = new URLSearchParams(location.search).get('relevance') || '';
fetchStatsWithRelevance(relevance).then(stats => {
  currentStats = stats;
  currentFilters = renderFilterBar(document.getElementById('filter-bar-container'), stats, 'countries.html', {
    search: { placeholder: 'Search country names…', param: 'q', onInput: v => { currentQuery = v; render(); } },
    relevance: true,
    metrics: [
      { key: 'papers', label: 'Papers' },
      { key: 'avg', label: 'Citations / paper' },
      { key: 'total', label: 'Citations' },
    ],
    topN: {
      default: 50, storageKey: 'countries-timeline-topn',
      onChange: n => { if (currentTimelineDraw) currentTimelineDraw(n); render(); },
    },
  });
  render();
}).catch(err => {
  document.getElementById('map').textContent = 'Could not load stats.json: ' + err;
});

function row(cells) {
  const tr = document.createElement('tr');
  cells.forEach((c, i) => {
    const td = document.createElement('td');
    // Columns 2+ (Papers/Authors/Total citations/Citations-per-paper) are
    // always numeric-position, even when the cell's actual value is the
    // '—' fallback string from fmtAvg() -- typeof-checking the value
    // missed exactly that case, leaving "no data" rows left-aligned while
    // every real-number row was right-aligned (user-reported: column not
    // consistently right-aligned).
    if (i > 1) td.className = 'num';
    if (c instanceof Node) td.appendChild(c);
    else td.textContent = c;
    tr.appendChild(td);
  });
  return tr;
}

function render() {
  const stats = currentStats, filters = currentFilters;
  const papers = filterPapers(stats.all_papers || [], filters);
  const countries = aggregateByDimension(papers, p => p.countries, { minPapers: 0, minCitedForAvg: 3 });
  // Attributed via each author's OWN country (stats.author_detail), not
  // every country the paper as a whole touches -- a paper with authors
  // spread across 3 countries must not credit all of its authors to each
  // of those 3 countries, which is what using paper.countries here would
  // do (confirmed on real data: a handful of countries were showing 100+
  // "authors" off a single paper). Only covers authors with an enriched
  // detail record, so this is a lower bound, not the full author count --
  // consistent with how author_detail is used everywhere else on the site.
  const authorDetail = stats.author_detail || {};
  const authorsByCountry = {};
  papers.forEach(p => {
    (p.authors || []).forEach(name => {
      (authorDetail[name] ? authorDetail[name].countries : []).forEach(c => {
        const set = authorsByCountry[c] || (authorsByCountry[c] = new Set());
        set.add(name);
      });
    });
  });
  countries.forEach(c => { c.authors = (authorsByCountry[c.name] || new Set()).size; });
  const query = currentQuery.trim().toLowerCase();
  let tableRows = query ? countries.filter(c => matchesSearchQuery(c.name, query)) : countries;

  const metric = getMetric('papers');
  const sorters = {
    total: (a, b) => b.citations - a.citations,
    avg: (a, b) => (b.avg_citations ?? -Infinity) - (a.avg_citations ?? -Infinity),
    papers: (a, b) => b.papers - a.papers,
  };
  countries.sort(sorters[metric] || sorters.papers);
  tableRows.sort(sorters[metric] || sorters.papers);

  // "Show top N" caps the table AND dims every map tile outside that same
  // top N (user-requested: changing Show top should change the map too) --
  // dimmed rather than removed, same treatment as a search-query mismatch
  // just below, so the map's geography stays intact rather than leaving
  // gaps where a country used to be.
  const topN = filters.topN || 50;
  const matchCount = tableRows.length;
  tableRows = tableRows.slice(0, topN);

  document.getElementById('result-count').textContent = matchCount > topN
    ? `${tableRows.length} of ${matchCount} countries (top ${topN})`
    : `${tableRows.length} countries`;
  document.getElementById('total-countries-stat').textContent =
    `${countries.length} countries with AV papers in this corpus`;

  const rankMetricKey = metric === 'avg' ? 'avg_citations' : metric === 'papers' ? 'papers' : 'citations';
  const max = Math.max(1, ...countries.map(c => c[rankMetricKey] || 0));

  const grid = document.getElementById('map');
  grid.innerHTML = '';
  const byName = {};
  countries.forEach(c => { byName[c.name] = c; });
  const topNCountries = new Set(countries.slice(0, topN).map(c => c.name));

  // A country with zero papers has nothing to link to or show a value for --
  // rendering it as a dashed "zero" tile implied it was clickable/meaningful
  // when it wasn't. Skip it entirely rather than showing a dead tile.
  Object.entries(COUNTRY_GRID).forEach(([name, [rowN, col]]) => {
    const c = byName[name];
    if (!c) return;
    const tile = document.createElement('a');
    tile.className = 'tile';
    tile.style.gridRow = rowN + 1;
    tile.style.gridColumn = col + 1;
    tile.title = `${name}: ${c.citations} citations, ${c.papers} papers (avg ${fmtAvg(c.avg_citations)})`;
    tile.textContent = initials(name);
    tile.href = `index.html?country=${encodeURIComponent(name)}`;
    const t = Math.min(1, (c[rankMetricKey] || 0) / max);
    const step = Math.min(SEQ_RAMP.length - 1, Math.round(t * (SEQ_RAMP.length - 1)));
    tile.style.background = SEQ_RAMP[step];
    if (step <= 2) tile.style.color = '#0b0b0b';
    if ((query && !matchesSearchQuery(name, query)) || !topNCountries.has(name)) tile.style.opacity = '0.25';
    grid.appendChild(tile);
  });

  const legend = document.getElementById('legend');
  legend.innerHTML = '<span>Lower</span>';
  SEQ_RAMP.forEach(hex => {
    const sw = document.createElement('span');
    sw.className = 'swatch';
    sw.style.background = hex;
    legend.appendChild(sw);
  });
  legend.appendChild(Object.assign(document.createElement('span'), { textContent: 'Higher' }));

  const tbody = document.getElementById('countries-body');
  function renderBody(data) {
    tbody.innerHTML = '';
    data.forEach((c, i) => {
      const nameLink = document.createElement('a');
      nameLink.href = `index.html?country=${encodeURIComponent(c.name)}`;
      nameLink.textContent = c.name;
      nameLink.style.color = 'var(--text)';
      tbody.appendChild(row([pageOffset + i + 1, nameLink, c.papers, c.authors, c.citations, fmtAvg(c.avg_citations)]));
    });
    appendSumRow(tbody, data, [null, null, r => r.papers, r => r.authors, r => r.citations, null]);
  }
  let pageOffset = 0;
  function renderCountriesPage() {
    const pg = renderPagination(document.getElementById('countries-pagination'), 'countries.html', tableRows.length, { onChange: renderCountriesPage });
    pageOffset = pg.offset;
    const shown = tableRows.slice(pg.offset, pg.offset + pg.pageSize);
    makeSortableSafe(tbody.closest('table'), shown, [
      null,
      { accessor: c => c.name, numeric: false },
      { accessor: c => c.papers, numeric: true },
      { accessor: c => c.authors, numeric: true },
      { accessor: c => c.citations, numeric: true },
      { accessor: c => c.avg_citations ?? -Infinity, numeric: true },
    ], renderBody);
  }
  renderCountriesPage();

  const exportContainer = document.getElementById('export-container');
  exportContainer.innerHTML = '';
  exportContainer.appendChild(renderExportButton(tbody.closest('table'), 'av-atlas-countries.csv'));

  currentTimelineDraw = renderDimensionTimeline({
    papers, dimensionFn: p => p.countries, labelFor: v => v,
    rankedNames: countries.map(c => c.name),
    elIds: { legend: 'timeline-legend', chart: 'timeline-chart', tooltip: 'timeline-tooltip', normalize: 'timeline-normalize' },
  });
  currentTimelineDraw(filters.topN || 10);
}
</script>
<script src="nav.js"></script>
<script src="sortable.js"></script>
</body>
</html>

<!DOCTYPE html>

<title>AV Atlas: Compare</title>
<meta name="description" content="Compare researchers, institutions, countries, venues or topics side by side within autonomous vehicle research.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="AV Atlas">

<meta property="og:description" content="Compare researchers, institutions, countries, venues or topics side by side within autonomous vehicle research.">
<meta property="og:url" content="https://nightrome.github.io/av-atlas/compare.html">
<meta property="og:image" content="https://nightrome.github.io/av-atlas/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="AV Atlas: Compare">
<meta name="twitter:description" content="Compare researchers, institutions, countries, venues or topics side by side within autonomous vehicle research.">
<meta name="twitter:image" content="https://nightrome.github.io/av-atlas/og-image.png">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="theme-light.css">
<style>
  body { max-width: 1100px; margin: 0 auto; padding: 24px; }
  .page-title { margin: 0 0 4px; font-size: 1.5em; }
  .section-intro { color: var(--muted); font-size: 0.88em; margin: 0 0 16px; line-height: 1.5; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px 20px; margin-bottom: 20px; }
  .panel h2 { margin-top: 0; font-size: 1.1em; }
  table { width: 100%; border-collapse: collapse; font-size: 0.92em; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td a { color: var(--accent); text-decoration: none; }
  td a:hover { text-decoration: underline; }
  /* The metric rows read across, so the leading label column carries the
     meaning and should not compete with the numbers for weight. */
  .metric-label { color: var(--muted); }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: baseline; }
  .subject-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .subject-chip {
    display: inline-flex; align-items: center; gap: 6px; background: var(--panel2);
    border: 1px solid var(--border); border-radius: 14px; padding: 4px 6px 4px 10px; font-size: 0.88em;
  }
  .subject-chip button {
    background: none; border: none; color: var(--muted); cursor: pointer;
    font: inherit; line-height: 1; padding: 2px 4px; border-radius: 8px;
  }
  .subject-chip button:hover { color: var(--accent); background: var(--panel); }
  .line-chart-wrap { position: relative; }
  .tooltip-box {
    position: absolute; background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 10px; font-size: 0.8em; pointer-events: none; box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    display: none; z-index: 10; white-space: nowrap;
  }
  .legend-row { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px; font-size: 0.82em; color: var(--muted); }
  .empty-note { color: var(--muted); font-size: 0.9em; }
  .table-scroll { overflow-x: auto; }
</style>
</head>
<body>
<nav id="topnav"></nav>
<div id="detail-back-container"></div>

<h1 class="page-title" id="page-title">Compare</h1>
<p class="section-intro" id="page-intro"></p>
<div class="subject-chips" id="subject-chips"></div>
<div id="coverage-note-container"></div>

<div class="panel" id="metrics-panel">
  <h2>Side by side</h2>
  <div class="table-scroll">
    <table id="metrics-table"><tbody id="metrics-body"></tbody></table>
  </div>
</div>

<div class="panel" id="timeline-panel">
  <h2>Papers per year</h2>
  <p class="section-intro" id="timeline-note"></p>
  <div class="line-chart-wrap">
    <svg id="compare-chart"></svg>
    <div class="tooltip-box" id="compare-tooltip"></div>
  </div>
  <div class="legend-row" id="compare-legend"></div>
</div>

<div class="panel" id="topics-panel">
  <h2>Where the work is</h2>
  <p class="section-intro">Each column's share of its own papers, by topic. Shows what a group works
    on, not how much it publishes — so a small group and a large one can be compared directly.</p>
  <div class="table-scroll">
    <table id="topics-table"><thead id="topics-head"></thead><tbody id="topics-body"></tbody></table>
  </div>
</div>

<div class="panel" id="papers-panel">
  <h2>Most-cited papers</h2>
  <div class="table-scroll">
    <table id="papers-table"><thead id="papers-head"></thead><tbody id="papers-body"></tbody></table>
  </div>
</div>

<script src="filters.js"></script>
<script>
// Compare view: two to four researchers, institutions, countries, venues or
// topics on one set of axes.
//
// "How do we compare to X?" is the question a reader of a leaderboard
// actually has, and answering it used to mean opening several tabs and
// holding numbers in your head -- the pages themselves could only ever show
// one entity at a time. Everything here is computed client-side from
// all_papers, exactly like the list pages, so a comparison always respects
// the same corpus and the same definitions the rest of the site uses.
//
// The URL carries the whole view (?type=author&names=A|B|C), so a comparison
// is a link -- which is the point, for something people want to send to a
// colleague or cite in a slide.

// Each dimension: how to pull its values off a paper, and where its own
// detail page lives. `accessor` returns an array because a paper belongs to
// several institutions and countries at once, and to exactly one venue and
// one category -- normalizing that here keeps everything below uniform.
const DIMENSIONS = {
  author: {
    label: 'researchers', accessor: p => p.authors || [], page: 'author.html', param: 'name',
  },
  institution: {
    label: 'institutions', accessor: p => p.institutions || [], page: 'institution.html', param: 'name',
    coverage: true,
  },
  country: {
    label: 'countries', accessor: p => p.countries || [], page: null, param: null,
    coverage: true,
  },
  venue: {
    label: 'venues', accessor: p => (p.venue ? [p.venue] : []), page: 'venue.html', param: 'name',
  },
  category: {
    label: 'topics', accessor: p => (p.category ? [p.category] : []), page: null, param: null,
  },
};

// Four is the cap. Beyond that the lines stop being separable and the table
// stops fitting a laptop screen without horizontal scroll, and the comparison
// a reader can actually read is worth more than one that holds everything.
const MAX_SUBJECTS = 4;

const params = new URLSearchParams(location.search);
const type = DIMENSIONS[params.get('type')] ? params.get('type') : 'author';
// "|" rather than "," because institution and venue names contain commas
// ("University of California, San Diego") and would split mid-name.
const subjects = (params.get('names') || '').split('|').map(s => s.trim())
  .filter(Boolean).slice(0, MAX_SUBJECTS);

function fmt(n) { return n == null ? 'n/a' : Number(n).toLocaleString(); }

function subjectLink(name) {
  const dim = DIMENSIONS[type];
  const label = type === 'category' ? categoryLabel(name)
    : type === 'venue' && window.venueDisplayName ? venueDisplayName(name) : name;
  if (!dim.page) {
    // Countries and categories have no detail page of their own; send the
    // reader to the Papers list filtered to that value instead, which is
    // where those names link from everywhere else on the site.
    const a = document.createElement('a');
    a.href = `index.html?${type}=${encodeURIComponent(name)}`;
    a.textContent = label;
    return a;
  }
  const a = document.createElement('a');
  a.href = `${dim.page}?${dim.param}=${encodeURIComponent(name)}`;
  a.textContent = label;
  return a;
}

function removeUrl(name) {
  const rest = subjects.filter(s => s !== name);
  return rest.length
    ? `compare.html?type=${encodeURIComponent(type)}&names=${encodeURIComponent(rest.join('|'))}`
    : `${type === 'author' ? 'authors' : type === 'category' ? 'categories' : type + 's'}.html`;
}

function renderChips() {
  const wrap = document.getElementById('subject-chips');
  wrap.innerHTML = '';
  subjects.forEach((name, i) => {
    const chip = document.createElement('span');
    chip.className = 'subject-chip';
    const sw = document.createElement('span');
    sw.className = 'swatch';
    sw.style.background = TIMELINE_PALETTE[i % TIMELINE_PALETTE.length];
    chip.appendChild(sw);
    chip.appendChild(subjectLink(name));
    const rm = document.createElement('a');
    rm.href = removeUrl(name);
    rm.textContent = '×';
    rm.title = `Remove ${name} from this comparison`;
    rm.style.cssText = 'color:var(--muted);text-decoration:none;padding:2px 4px;';
    chip.appendChild(rm);
    wrap.appendChild(chip);
  });
}

function papersFor(allPapers, name) {
  const accessor = DIMENSIONS[type].accessor;
  return allPapers.filter(p => accessor(p).includes(name));
}

function metricsFor(papers, subjectName) {
  const cited = papers.filter(p => p.citations);
  const years = papers.map(p => p.year).filter(Boolean);
  const citations = papers.reduce((n, p) => n + (p.citations || 0), 0);
  // For a researcher this is their co-authors, so the person themselves is
  // not counted -- "Andreas Geiger: 161 distinct authors" reads as a claim
  // about a group rather than about one person's collaborators.
  const authors = new Set();
  papers.forEach(p => (p.authors || []).forEach(a => { if (a !== subjectName) authors.add(a); }));
  return {
    papers: papers.length,
    citations,
    // Averaged over papers with at least one citation, the same denominator
    // every other page on this site uses -- a paper nothing here cites yet is
    // as likely to be a coverage gap as a real zero.
    avg: cited.length ? Math.round(citations / cited.length) : null,
    best: papers.reduce((b, p) => ((p.citations || 0) > (b ? b.citations || 0 : -1) ? p : b), null),
    firstYear: years.length ? Math.min(...years) : null,
    lastYear: years.length ? Math.max(...years) : null,
    people: authors.size,
  };
}

const PEOPLE_LABEL = type === 'author' ? 'Distinct co-authors' : 'Distinct authors';

const METRIC_ROWS = [
  { label: 'Papers', get: m => fmt(m.papers) },
  { label: 'Citations', get: m => fmt(m.citations), term: 'citations_group' },
  { label: 'Citations / paper', get: m => fmt(m.avg), term: 'citations_per_paper' },
  { label: PEOPLE_LABEL, get: m => fmt(m.people) },
  { label: 'Active years', get: m => (m.firstYear ? `${m.firstYear}–${m.lastYear}` : 'n/a') },
];

function renderMetrics(byName) {
  const tbody = document.getElementById('metrics-body');
  tbody.innerHTML = '';
  const header = document.createElement('tr');
  header.appendChild(document.createElement('th'));
  subjects.forEach((name, i) => {
    const th = document.createElement('th');
    th.className = 'num';
    const sw = document.createElement('span');
    sw.className = 'swatch';
    sw.style.background = TIMELINE_PALETTE[i % TIMELINE_PALETTE.length];
    th.appendChild(sw);
    th.appendChild(subjectLink(name));
    header.appendChild(th);
  });
  tbody.appendChild(header);

  METRIC_ROWS.forEach(row => {
    const tr = document.createElement('tr');
    const label = document.createElement('td');
    label.className = 'metric-label';
    label.textContent = row.label;
    if (row.term) label.setAttribute('data-term', row.term);
    tr.appendChild(label);
    subjects.forEach(name => {
      const td = document.createElement('td');
      td.className = 'num';
      td.textContent = row.get(byName[name].metrics);
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  applyGlossary(tbody);
}

function renderTimeline(byName) {
  const years = new Set();
  subjects.forEach(name => byName[name].papers.forEach(p => {
    if (p.year && p.year !== window.PARTIAL_YEAR) years.add(p.year);
  }));
  const allYears = [...years].sort();
  const series = subjects.map((name, i) => {
    const byYear = {};
    byName[name].papers.forEach(p => { byYear[p.year] = (byYear[p.year] || 0) + 1; });
    const values = {};
    allYears.forEach(y => { values[y] = byYear[y] || 0; });
    return { name, color: TIMELINE_PALETTE[i % TIMELINE_PALETTE.length], values };
  });
  lineChart(document.getElementById('compare-chart'), document.getElementById('compare-tooltip'),
    series, allYears, v => `${v} paper${v === 1 ? '' : 's'}`, { yLabel: 'Papers per year' });

  const legend = document.getElementById('compare-legend');
  legend.innerHTML = '';
  series.forEach(s => {
    const item = document.createElement('div');
    renderSwatchLabel(item, s.color, s.name);
    legend.appendChild(item);
  });
  document.getElementById('timeline-note').textContent =
    'Counts, not shares. Stops at the last complete year, like every trend line on this site.';
}

function renderTopics(byName) {
  // Union of each column's top topics, so the table shows what distinguishes
  // these groups rather than a fixed list most of which is zero everywhere.
  const shares = {};
  subjects.forEach(name => {
    const counts = {};
    byName[name].papers.forEach(p => {
      const c = p.category || 'uncategorized';
      counts[c] = (counts[c] || 0) + 1;
    });
    const total = byName[name].papers.length || 1;
    shares[name] = counts;
    shares[name]._total = total;
  });
  const top = new Set();
  subjects.forEach(name => {
    Object.keys(shares[name]).filter(k => k !== '_total' && k !== 'uncategorized')
      .sort((a, b) => shares[name][b] - shares[name][a]).slice(0, 6).forEach(k => top.add(k));
  });
  const cats = [...top].sort((a, b) => {
    const sum = c => subjects.reduce((n, s) => n + (shares[s][c] || 0) / shares[s]._total, 0);
    return sum(b) - sum(a);
  });

  const head = document.getElementById('topics-head');
  head.innerHTML = '';
  const hr = document.createElement('tr');
  const th0 = document.createElement('th');
  th0.textContent = 'Topic';
  hr.appendChild(th0);
  subjects.forEach(name => {
    const th = document.createElement('th');
    th.className = 'num';
    th.textContent = type === 'venue' && window.venueDisplayName ? venueDisplayName(name) : name;
    hr.appendChild(th);
  });
  head.appendChild(hr);

  const body = document.getElementById('topics-body');
  body.innerHTML = '';
  cats.forEach(cat => {
    const tr = document.createElement('tr');
    const td = document.createElement('td');
    const link = document.createElement('a');
    link.href = `index.html?category=${encodeURIComponent(cat)}`;
    link.textContent = categoryLabel(cat);
    td.appendChild(link);
    tr.appendChild(td);
    subjects.forEach(name => {
      const cell = document.createElement('td');
      cell.className = 'num';
      const n = shares[name][cat] || 0;
      cell.textContent = n ? `${Math.round(100 * n / shares[name]._total)}% (${n})` : '—';
      tr.appendChild(cell);
    });
    body.appendChild(tr);
  });
  document.getElementById('topics-panel').style.display = cats.length ? '' : 'none';
}

function renderPapers(byName) {
  const head = document.getElementById('papers-head');
  head.innerHTML = '';
  const hr = document.createElement('tr');
  subjects.forEach(name => {
    const th = document.createElement('th');
    th.textContent = type === 'venue' && window.venueDisplayName ? venueDisplayName(name) : name;
    hr.appendChild(th);
  });
  head.appendChild(hr);

  const tops = subjects.map(name => [...byName[name].papers]
    .sort((a, b) => (b.citations || 0) - (a.citations || 0)).slice(0, 5));
  const body = document.getElementById('papers-body');
  body.innerHTML = '';
  for (let row = 0; row < 5; row++) {
    const tr = document.createElement('tr');
    tops.forEach(list => {
      const td = document.createElement('td');
      const p = list[row];
      if (p) {
        const a = document.createElement('a');
        a.href = `paper.html?title=${encodeURIComponent(p.title)}`;
        a.textContent = p.title;
        a.title = p.title;
        a.style.cssText = 'display:inline-block;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom;';
        td.appendChild(a);
        const meta = document.createElement('div');
        meta.style.cssText = 'color:var(--muted);font-size:0.82em;';
        meta.textContent = `${p.year || 'n/a'} · ${fmt(p.citations)} citations`;
        td.appendChild(meta);
      } else {
        td.textContent = '—';
      }
      tr.appendChild(td);
    });
    body.appendChild(tr);
  }
}

fetch('stats.json').then(r => r.json()).then(applyCitationSource).then(stats => {
  const backContainer = document.getElementById('detail-back-container');
  const back = renderBackLink();
  if (back && backContainer) backContainer.appendChild(back);

  const dim = DIMENSIONS[type];
  document.getElementById('page-title').textContent = `Compare ${dim.label}`;
  setDetailPageMeta(subjects.length ? `${subjects.join(' vs ')}` : 'Compare',
    `Side-by-side comparison of ${subjects.join(', ')} within autonomous vehicle research.`);

  if (subjects.length < 2) {
    document.getElementById('page-intro').textContent =
      `Pick at least two ${dim.label} to compare. Tick them on the list page and use the Compare button.`;
    ['metrics-panel', 'timeline-panel', 'topics-panel', 'papers-panel']
      .forEach(id => { document.getElementById(id).style.display = 'none'; });
    return;
  }

  const allPapers = stats.all_papers || [];
  const byName = {};
  subjects.forEach(name => {
    const papers = papersFor(allPapers, name);
    byName[name] = { papers, metrics: metricsFor(papers, type === 'author' ? name : null) };
  });

  document.getElementById('page-intro').textContent =
    `Every figure below is computed over AV papers only, with the same definitions the rest of the `
    + `site uses. Citations count other papers in this corpus, not an external database.`;

  if (dim.coverage) {
    renderCoverageBanner(document.getElementById('coverage-note-container'), allPapers, {
      accessor: dim.accessor,
      what: 'Author affiliations',
      between: dim.label,
    });
  }

  renderChips();
  renderMetrics(byName);
  renderTimeline(byName);
  renderTopics(byName);
  renderPapers(byName);
}).catch(err => {
  document.getElementById('page-intro').textContent = 'Could not load stats.json: ' + err;
});
</script>
<script src="nav.js"></script>
<script src="sortable.js"></script>
</body>
</html>

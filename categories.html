<style>
  body { max-width: 1100px; margin: 0 auto; padding: 24px; }
  .page-title { margin: 0 0 16px; font-size: 1.5em; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px 20px; margin: 20px 0; }
  .bar-row, .bar-header { display: grid; grid-template-columns: 190px 1fr 80px 70px 80px 90px; align-items: center; gap: 10px; padding: 6px 0; }
  .bar-row a { color: var(--text); text-decoration: none; font-size: 0.92em; }
  .bar-row a:hover { text-decoration: underline; }
  .bar-track { background: var(--panel2); border-radius: 4px; height: 18px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 4px; }
  .bar-num { text-align: right; font-variant-numeric: tabular-nums; font-size: 0.85em; color: var(--muted); }
  .bar-header { font-size: 0.78em; color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
  .bar-header .bar-num { font-weight: 600; }
  .bar-num.active-metric { color: var(--text); font-weight: 700; }

  .line-chart-wrap { position: relative; }
  .line-chart-wrap svg { width: 100%; height: auto; display: block; }
  .series-line { fill: none; stroke-width: 2.5; opacity: 0.9; }
  .series-line.dimmed { opacity: 0.12; }
  .series-dot { cursor: pointer; }
  .series-dot.dimmed { opacity: 0.12; }
  .axis-line { stroke: var(--border); }
  .axis-label { fill: var(--muted); font-size: 10.5px; }
  .crosshair { stroke: var(--muted); stroke-dasharray: 3 3; pointer-events: none; }
  .legend-row { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 12px 0 4px; }
  .legend-item {
    display: flex; align-items: center; gap: 6px; font-size: 0.82em; color: var(--text);
    cursor: pointer; user-select: none; padding: 2px 4px; border-radius: 5px;
  }
  .legend-item:hover { background: var(--panel2); }
  .legend-item.off { color: var(--muted); text-decoration: line-through; opacity: 0.6; }
  .legend-item .swatch { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }
  .tooltip-box {
    position: absolute; background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; font-size: 0.8em; pointer-events: none; box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    min-width: 140px; display: none; z-index: 10;
  }
  .tooltip-box .tt-year { font-weight: 700; margin-bottom: 4px; }
  .tooltip-box .tt-row { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .tooltip-box .tt-swatch { width: 9px; height: 9px; border-radius: 2px; flex-shrink: 0; }
  .tooltip-box .tt-val { margin-left: auto; font-variant-numeric: tabular-nums; padding-left: 10px; }
  .timeline-controls-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: -4px 0 4px; font-size: 0.85em; color: var(--muted); }
  .uncategorized-note {
    margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border);
    font-size: 0.85em; color: var(--muted); line-height: 1.5;
  }
  .uncategorized-note a { color: var(--accent); }
</style>
</head>
<body>
<nav id="topnav"></nav>
<div id="filter-bar-container"></div>

<div class="panel" id="timeline-panel">
  <div class="panel-title-row">
    <h2 style="margin-top:0; font-size: 1.1em;">Categories over time</h2>
  <span class="info-tip" tabindex="0" role="img" aria-label="Each line is a category&#x27;s share (or count) of AV papers per year. Click a legend entry to toggle a line." data-tip="Each line is a category&#x27;s share (or count) of AV papers per year. Click a legend entry to toggle a line.">i</span></div>
  <div class="timeline-controls-row">
    <label style="display:flex;align-items:center;gap:4px;">
      <input type="checkbox" id="category-normalize" checked>
      Normalize by total papers that year
    </label>
  </div>
  <div class="line-chart-wrap" id="category-chart-wrap">
    <svg id="category-chart"></svg>
    <div class="tooltip-box" id="category-tooltip"></div>
  </div>
  <div class="legend-row" id="category-legend"></div>
</div>

<div class="panel">
  <div class="panel-title-row"><h2 style="margin-top:0; font-size: 1.1em;">Category ranking</h2><span class="info-tip" tabindex="0" role="img" aria-label="Topic categories by paper count and in-corpus citations. Industry % is the share of a category's author affiliations classified as industry rather than academic (a keyword match plus a hand-curated exception list); affiliations that can't be classified confidently are left out rather than guessed at." data-tip="Topic categories by paper count and in-corpus citations. Industry % is the share of a category's author affiliations classified as industry rather than academic (a keyword match plus a hand-curated exception list); affiliations that can't be classified confidently are left out rather than guessed at.">i</span></div>
  <div id="bars"></div>
</div>

<script src="filters.js?v=1789288051"></script>
<script>
const SEQ_RAMP = ['#cde2fb', '#9ec5f4', '#6da7ec', '#3987e5', '#256abf', '#184f95', '#0d366b'];

let currentStats = null, currentFilters = null;
let currentTimelineDraw = null;
// No "Show" (relevance) filter -- user-requested: a non-AV-relevant paper
// isn't meaningfully categorized in the first place (category alone, per
// About's own Method section, isn't what decides AV-relevance; the non-AV
// set is mostly generic CV/ML work the taxonomy's broad keywords still match
// something in), so browsing it by category doesn't answer a real question
// the way it does for Papers/Authors/Institutions. Always the AV set.
fetchStatsWithRelevance('').then(stats => {
  currentStats = stats;
  currentFilters = renderFilterBar(document.getElementById('filter-bar-container'), stats, 'categories.html', {
    showCategory: false,
    singleRow: true,
    checkbox: {
      id: 'exclude-datasets', dropdownLabel: 'DATASETS',
      storageKey: 'categories-exclude-datasets', onChange: () => render(),
    },
    metrics: [
      { key: 'total', label: 'Citations' },
      { key: 'papers', label: 'Papers' },
      { key: 'avg', label: 'Citations / paper' },
    ],
  });
  render();
}).catch(err => {
  document.getElementById('bars').textContent = 'Could not load stats.json: ' + err;
});

// "Datasets" (the dataset-benchmark-paper category) papers introduce datasets
// rather than reporting a method's results -- their citation/paper counts
// behave very differently from every other category (a handful of landmark
// dataset papers accumulate huge citation counts just by being the standard
// benchmark everyone reports on), which can dominate both the ranking bars
// and the "over time" chart. User-requested: an explicit toggle to exclude
// them, applied to both -- not just this page's own display, but the
// category counts a reader sees reflected in the ranking bars and chart.
function withoutDatasetsIfExcluded(papers) {
  const excludeCheckbox = document.getElementById('exclude-datasets');
  if (!excludeCheckbox || !excludeCheckbox.checked) return papers;
  return papers.filter(p => p.category !== 'dataset-benchmark-paper');
}

// CATEGORY_LABELS/categoryLabel now live in filters.js (shared with the
// Category dropdown on every other page, and every table's Category column).
const labelFor = categoryLabel;

// Same fixed categorical palette as network.html, for a consistent visual
// language across the site's "many distinct series" pages.
const PALETTE = [
  '#e6614f', '#3987e5', '#3fae6a', '#e6a53f', '#9366d9', '#3fb8bd',
  '#d9527a', '#7a9e3f', '#c98e3f', '#5f7de6', '#4fa88a', '#c95fd0',
];

function computeYearAgg(papers) {
  const agg = {};
  papers.forEach(p => {
    if (!p.year) return;
    agg[p.year] = agg[p.year] || { papers: 0, citations: 0, papersWithCitations: 0 };
    agg[p.year].papers += 1;
    if (p.citations != null) {
      agg[p.year].citations += p.citations;
      agg[p.year].papersWithCitations += 1;
    }
  });
  const out = {};
  Object.keys(agg).sort().forEach(y => {
    const v = agg[y];
    out[y] = {
      papers: v.papers,
      citations: v.citations,
      avg_citations: v.papersWithCitations ? Math.round(v.citations / v.papersWithCitations) : null,
    };
  });
  return out;
}

// lineChart itself now lives in filters.js, shared with datasets.html and
// every other "N series over time" page -- this page keeps its own
// renderCategoryTimeline since it has the normalize-by-year-total toggle
// that no other page needs.
function renderCategoryTimeline(stats, filters) {
  const allYearsPapers = withoutDatasetsIfExcluded(filterPapers(stats.all_papers || [], { ...filters, category: null }));
  const overallByYear = computeYearAgg(allYearsPapers);
  // See renderDimensionTimeline in filters.js: trend lines stop at the last
  // complete year, so the partial current year doesn't read as a collapse.
  const allYears = Object.keys(overallByYear)
    .filter(y => Number(y) !== window.PARTIAL_YEAR).sort();

  const byCategory = {};
  allYearsPapers.forEach(p => {
    const cat = p.category || 'uncategorized';
    // "Uncategorized" isn't a real category -- it's every paper the
    // taxonomy hasn't caught up to yet (see categories.json's _readme) --
    // so it doesn't belong as a series next to genuine categories here.
    if (cat === 'uncategorized') return;
    (byCategory[cat] = byCategory[cat] || []).push(p);
  });

  // In memory only for this pageview, not persisted -- a refresh always
  // starts with every series visible (user-flagged: a struck-out legend
  // entry surviving a refresh reads as stuck, not remembered).
  const hidden = new Set();

  const normalizeCheckbox = document.getElementById('category-normalize');

  function rebuild(topN) {
    let topCategories = Object.entries(byCategory)
      .sort((a, b) => b[1].length - a[1].length)
      .slice(0, topN)
      .map(kv => kv[0]);
    // "Datasets" is rare by paper count (a handful of landmark dataset
    // papers), so it normally falls out of the top-N-by-count cut on its
    // own -- indistinguishable from having been excluded by the checkbox
    // above. If the reader has chosen to include dataset papers, they
    // should actually see the category here, not have it silently vanish
    // the same way it would if excluded (user-reported).
    if (byCategory['dataset-benchmark-paper'] && !topCategories.includes('dataset-benchmark-paper')) {
      topCategories = topCategories.slice(0, Math.max(0, topN - 1));
      topCategories.push('dataset-benchmark-paper');
    }

    const legend = document.getElementById('category-legend');
    legend.innerHTML = '';
    renderLegendToggleAll(legend, hidden, topCategories, () => rebuild(topN));
    topCategories.forEach((cat, i) => {
      const item = document.createElement('div');
      item.className = 'legend-item' + (hidden.has(cat) ? ' off' : '');
      renderSwatchLabel(item, PALETTE[i % PALETTE.length], `${labelFor(cat)} (${byCategory[cat].length})`);
      item.addEventListener('click', () => {
        if (hidden.has(cat)) hidden.delete(cat); else hidden.add(cat);
        item.classList.toggle('off');
        draw();
      });
      legend.appendChild(item);
    });

    function draw() {
      const normalize = normalizeCheckbox.checked;
      const series = topCategories
        .filter(cat => !hidden.has(cat))
        .map(cat => {
          const catAgg = computeYearAgg(byCategory[cat]);
          const values = {};
          allYears.forEach(yr => {
            if (normalize) {
              const totalThatYear = (overallByYear[yr] || {}).papers || 0;
              values[yr] = totalThatYear && catAgg[yr] ? catAgg[yr].papers / totalThatYear : (catAgg[yr] ? 0 : null);
            } else {
              values[yr] = catAgg[yr] ? catAgg[yr].papers : null;
            }
          });
          return { name: labelFor(cat), color: PALETTE[topCategories.indexOf(cat) % PALETTE.length], values };
        });
      const fmt = normalize ? (v => `${(v * 100).toFixed(1)}% of that year's papers`) : (v => `${v} papers`);
      const axisFmt = normalize ? (v => `${Math.round(v * 100)}%`) : undefined;
      const yLabel = normalize ? '% of that year\'s papers' : 'Papers per year';
      lineChart(document.getElementById('category-chart'), document.getElementById('category-tooltip'),
        series, allYears, fmt, { formatAxis: axisFmt, yLabel });
    }
    normalizeCheckbox.onchange = draw;
    draw();
  }

  return rebuild;
}

// null means no paper in that category has a citation count at all (as
// opposed to a real average of 0) -- show "n/a", not a misleading number.
function fmtAvg(v) { return v == null ? 'n/a' : v; }

// Each paper's institutions (not each paper) counts as 1 vote toward its
// category's industry/academic tally (user-requested) -- a 3-institution
// collaboration contributes 3 votes, not 1, since the question is "how much
// of the WORK behind this category is industry vs. academic", not "how many
// papers have at least one industry co-author". Institutions not in
// stats.institution_sector (aggregate.py's classify_institution_sector --
// a heuristic, not exhaustive) are simply not counted either way.
function computeSectorTally(papers, institutionSector) {
  const tally = {};
  papers.forEach(p => {
    const cat = p.category || 'uncategorized';
    (p.institutions || []).forEach(inst => {
      const sector = institutionSector[inst];
      if (!sector) return;
      const t = tally[cat] || (tally[cat] = { industry: 0, academic: 0 });
      t[sector] += 1;
    });
  });
  return tally;
}

function render() {
  const stats = currentStats, filters = currentFilters;
  const papers = withoutDatasetsIfExcluded(filterPapers(stats.all_papers || [], filters));
  const allCats = aggregateByDimension(papers, p => [p.category || 'uncategorized'], { minPapers: 0 });
  // "Uncategorized" is not a topic -- it is the papers the taxonomy has no
  // bucket for yet. Ranked inline it competed with real topics as though it
  // were one, and (being by far the largest bucket) it sat near the top of
  // the list with a citations/paper figure that means nothing, since the
  // papers in it have nothing in common. Split out and rendered once at the
  // bottom, labeled for what it is. Not hidden: the size of this bucket is a
  // real limitation of the site and readers should be able to see it.
  const cats = allCats.filter(c => c.name !== 'uncategorized');
  const uncategorized = allCats.find(c => c.name === 'uncategorized') || null;
  const sectorTally = computeSectorTally(papers, stats.institution_sector || {});
  cats.forEach(c => {
    const t = sectorTally[c.name];
    const total = t ? t.industry + t.academic : 0;
    c.industry_pct = total > 0 ? Math.round(100 * t.industry / total) : null;
  });

  // Every ranked page on this site defaults to total citations, with the
  // same Citations / Papers / Citations-per-paper order in the dropdown.
  // Citations-per-paper used to be the default on several pages, which put
  // a 20-paper company above every university and a 31-paper journal above
  // CVPR on the strength of one dataset paper each -- technically what the
  // metric says, and a poor default view of the field. It is still one
  // click away, with the Min. control there to raise the floor first.
  const metric = getMetric('total');
  const byAvg = (a, b) => (b.avg_citations ?? -Infinity) - (a.avg_citations ?? -Infinity);
  const sorters = {
    total: (a, b) => b.citations - a.citations,
    avg: byAvg,
    papers: (a, b) => b.papers - a.papers,
    // Unclassified (industry_pct == null) sorts last regardless of
    // direction -- same "no data must never look like zero" rule used for
    // citations elsewhere on this site (see index.html's citationsCell).
    industry: (a, b) => (b.industry_pct ?? -1) - (a.industry_pct ?? -1),
  };
  cats.sort(sorters[metric] || byAvg);

  document.getElementById('result-count').textContent = `${cats.length} categories`;

  const rankKey = metric === 'avg' ? 'avg_citations' : metric === 'papers' ? 'papers'
    : metric === 'industry' ? 'industry_pct' : 'citations';
  const max = Math.max(1, ...cats.map(c => c[rankKey] || 0));
  const bars = document.getElementById('bars');
  bars.innerHTML = '';

  const header = document.createElement('div');
  header.className = 'bar-header';
  const nameHead = document.createElement('div');
  nameHead.textContent = 'Category';
  header.appendChild(nameHead);
  header.appendChild(document.createElement('div'));
  // Clicking a metric header re-ranks by that metric, same as clicking a
  // real <table> column header does everywhere else on the site -- this
  // panel renders as CSS-grid divs, not a <table>, so sortable.js doesn't
  // apply to it, but the same click-to-sort expectation still holds
  // (user-flagged: "Category ranking columns are not sortable").
  const metricTooltips = {
    total: 'How many other papers in this corpus cite a paper from this category. Counted only within this corpus, never from an external database.',
    papers: 'Number of AV-relevant papers currently assigned this category.',
    avg: 'Average in-corpus citations per paper, counted only over papers with a known citation count.',
  };
  [['total', 'Citations'], ['papers', 'Papers'], ['avg', 'Citations / paper']].forEach(([key, label]) => {
    const cell = document.createElement('div');
    cell.className = 'bar-num' + (metric === key ? ' active-metric' : '');
    cell.textContent = label;
    cell.title = metricTooltips[key];
    cell.style.cursor = 'pointer';
    cell.addEventListener('click', () => { location.href = withParam('categories.html', 'metric', key); });
    header.appendChild(cell);
  });
  const industryHead = document.createElement('div');
  industryHead.className = 'bar-num' + (metric === 'industry' ? ' active-metric' : '');
  industryHead.textContent = 'Industry';
  industryHead.title = 'Share of this category\'s author affiliations that are industry rather than '
    + 'academic (each paper\'s institutions each count as one vote). Institutions this site can\'t '
    + 'confidently classify either way aren\'t counted.';
  industryHead.style.cursor = 'pointer';
  industryHead.addEventListener('click', () => { location.href = withParam('categories.html', 'metric', 'industry'); });
  header.appendChild(industryHead);
  bars.appendChild(header);

  cats.forEach(c => {
    const row = document.createElement('div');
    row.className = 'bar-row';

    const label = document.createElement('a');
    label.href = `index.html?category=${encodeURIComponent(c.name)}`;
    label.textContent = labelFor(c.name);
    row.appendChild(label);

    // The bar always visualizes whichever metric is currently selected as
    // the ranking metric (see rankKey above), not a fixed one -- so
    // switching "Rank by" both re-sorts the rows and re-draws every bar to
    // reflect the new metric.
    const track = document.createElement('div');
    track.className = 'bar-track';
    const fill = document.createElement('div');
    fill.className = 'bar-fill';
    const t = (c[rankKey] || 0) / max;
    // Square-root scale for the visual only (the rows are already sorted by
    // the true value). On "Citations / paper" one category -- Datasets --
    // sits far above the rest, so a linear bar leaves every other category
    // a 2-3px sliver that conveys nothing. sqrt keeps the ordering and
    // still shows the outlier as the longest bar, while giving the pack
    // visible, comparable lengths.
    const w = Math.sqrt(t);
    const step = Math.min(SEQ_RAMP.length - 1, Math.round(w * (SEQ_RAMP.length - 1)));
    fill.style.background = SEQ_RAMP[step];
    fill.style.width = (w * 100) + '%';
    track.appendChild(fill);
    row.appendChild(track);

    const citNum = document.createElement('div');
    citNum.className = 'bar-num' + (metric === 'total' ? ' active-metric' : '');
    citNum.textContent = c.citations;
    row.appendChild(citNum);

    const papersNum = document.createElement('div');
    papersNum.className = 'bar-num' + (metric === 'papers' ? ' active-metric' : '');
    papersNum.textContent = c.papers;
    row.appendChild(papersNum);

    const avgNum = document.createElement('div');
    avgNum.className = 'bar-num' + (metric === 'avg' ? ' active-metric' : '');
    avgNum.textContent = fmtAvg(c.avg_citations);
    row.appendChild(avgNum);

    const industryNum = document.createElement('div');
    industryNum.className = 'bar-num' + (metric === 'industry' ? ' active-metric' : '');
    industryNum.textContent = c.industry_pct == null ? 'n/a' : `${c.industry_pct}%`;
    row.appendChild(industryNum);

    bars.appendChild(row);
  });

  // The uncategorized bucket, shown once below the ranking rather than
  // inside it -- a count and a plain statement of what it means, with no
  // bar and no citations/paper figure, both of which would invite reading
  // it as a topic that can be compared with the ones above.
  if (uncategorized && uncategorized.papers) {
    const note = document.createElement('div');
    note.className = 'uncategorized-note';
    const link = document.createElement('a');
    link.href = 'index.html?category=uncategorized';
    link.textContent = `${uncategorized.papers.toLocaleString()} papers`;
    note.append('Not in any category yet: ');
    note.appendChild(link);
    note.append(' ('
      + Math.round(100 * uncategorized.papers / (uncategorized.papers + cats.reduce((n, c) => n + c.papers, 0)))
      + '% of the papers matching these filters). These are papers the topic list above does not '
      + 'cover yet, not a topic of their own, so they are left out of the ranking.');
    bars.appendChild(note);
  }

  document.getElementById('timeline-panel').style.display = filters.category ? 'none' : '';
  if (!filters.category) {
    currentTimelineDraw = renderCategoryTimeline(stats, filters);
    currentTimelineDraw(10);
  }
}
</script>
<script src="nav.js?v=1789288051"></script>
</body>
</html>
